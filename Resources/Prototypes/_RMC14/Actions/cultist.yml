- type: entity
  parent: ActionMarineBase
  id: RMCActionCultistRites
  name: Hive Rites
  description: View your cult's shared Devotion, nurture a parasite, perform a joint sacrifice, arrange succession or reveal the cult in bound robes. Another cultist can join through their own Hive Rites button.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon: { sprite: _RMC14/Cultist/actions.rsi, state: revelation }
  - type: InstantAction
    event: !type:CultistRitesActionEvent

- type: entity
  parent: ActionMarineBase
  id: RMCActionCultistConvert
  name: Convert
  description: Convert a conscious human next to you after ten uninterrupted seconds. Successful conversion has a three-minute cooldown, shared across leader changes. Strong-willed leaders, police and synthetics are immune. Requires a living Queen.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon: { sprite: _RMC14/Cultist/actions.rsi, state: convert }
  - type: TargetAction
    range: 1.5
  - type: EntityTargetAction
    event: !type:CultistConvertActionEvent

- type: entity
  parent: ActionMarineBase
  id: RMCActionCultistStun
  name: Psychic Stun
  description: Root a nearby human while you channel for two seconds, then knock them unconscious. Requires a living Queen. Strong-willed leaders, police and synthetics are immune.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon: { sprite: _RMC14/Cultist/actions.rsi, state: stun }
  - type: TargetAction
    range: 1.5
  - type: EntityTargetAction
    event: !type:CultistStunActionEvent
